[env:nodemcu-32s2]
platform = espressif32
board = nodemcu-32s2
framework = arduino

; --- USB CONFIGURATION ---
; MODE=0: USB-OTG / TinyUSB mode (required for MIDI, HID, MSC)
; MODE=1 would select Hardware CDC/JTAG only - no MIDI support
; CDC_ON_BOOT=1: Enables USB CDC serial so Serial works over USB
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Override board defaults that may set USB_MODE=1
build_unflags =
    -DARDUINO_USB_MODE=1

; --- MONITORING & UPLOAD ---
upload_protocol = esptool
monitor_speed = 115200
; 'direct' filter passes ANSI escape codes through unprocessed
monitor_filters = direct
; (Optional) Explicitly define ports if needed, otherwise PIO auto-detects
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; --- LIBRARIES ---
lib_deps =
    chegewara/ESP32TinyUSB@^2.0.2